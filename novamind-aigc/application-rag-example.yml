# RAG 智能检索配置示例
# 将以下配置添加到 application.yml 或 application-local.yml

# ============================================================
# 意图识别配置
# ============================================================
tj:
  ai:
    intent:
      # 是否启用意图识别（默认：true）
      # 设置为 false 将禁用意图识别，所有请求都使用 RAG
      enabled: true

      # 问题最小长度（字符数）
      # 低于此长度的问题将跳过 RAG（默认：10）
      min-length: 10

      # 长问题阈值（字符数）
      # 超过此长度的问题将默认启用 RAG（默认：30）
      long-question-threshold: 30

      # RAG 相关关键词列表
      # 包含这些关键词的问题将启用 RAG 检索
      rag-keywords:
        # 学习相关
        - "怎么"
        - "如何"
        - "为什么"
        - "原理"
        - "教程"
        - "学习"
        - "入门"
        - "进阶"
        - "方法"
        - "步骤"
        - "流程"
        - "指南"
        - "手册"
        - "文档"
        # 技术相关
        - "配置"
        - "部署"
        - "安装"
        - "搭建"
        - "环境"
        - "设置"
        - "优化"
        - "错误"
        - "异常"
        - "问题"
        - "解决"
        - "修复"
        - "调试"
        # 概念相关
        - "什么是"
        - "解释"
        - "介绍"
        - "概念"
        - "定义"
        - "区别"
        - "对比"
        - "机制"
        - "架构"
        - "设计"
        - "模式"

      # 闲聊关键词列表
      # 包含这些关键词的问题将跳过 RAG
      chat-keywords:
        - "你好"
        - "嗨"
        - "哈喽"
        - "早上好"
        - "下午好"
        - "晚上好"
        - "谢谢"
        - "感谢"
        - "谢了"
        - "多谢"
        - "再见"
        - "拜拜"
        - "下次见"
        - "在吗"
        - "在不在"
        - "有人吗"

    # ============================================================
    # RAG 检索配置
    # ============================================================
    rag:
      # 相似度阈值（0-1）
      # 越高越严格，只返回高度相似的文档（默认：0.6）
      # 建议值：0.5-0.7
      similarity-threshold: 0.6

      # 返回结果数量
      # 每次检索返回的最大文档数（默认：6）
      # 建议值：3-10
      top-k: 6

# ============================================================
# 日志配置（可选）
# ============================================================
logging:
  level:
    # 意图识别日志（DEBUG 级别可以看到详细信息）
    com.novamind.aigc.service.IntentClassifier: DEBUG

    # Advisor 工厂日志
    com.novamind.aigc.advisor.AdvisorFactory: DEBUG

    # ChatService 日志
    com.novamind.aigc.service.impl.ChatServiceImpl: INFO

