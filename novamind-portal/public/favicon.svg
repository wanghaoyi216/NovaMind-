<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nmMarkTitle">
  <title id="nmMarkTitle">NovaMind 智星云 · 标记</title>
  <defs>
    <linearGradient id="nm-mark-body" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d6f1ff"/>
      <stop offset="1" stop-color="#e4d0ff"/>
    </linearGradient>
    <linearGradient id="nm-mark-orbit" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="nm-mark-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="nm-mark-b1" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1"/></filter>
  </defs>
  <!-- 星核光晕 -->
  <circle cx="32" cy="33" r="26" fill="url(#nm-mark-glow)"/>
  <!-- 主轨道（呼应应用图标的 -16° 椭圆轨道） -->
  <g transform="rotate(-16 32 33)">
    <ellipse cx="32" cy="33" rx="26" ry="9.4" fill="none" stroke="url(#nm-mark-orbit)" stroke-width="1.6" stroke-opacity="0.55"/>
    <path d="M58 33 A26 9.4 0 0 0 6 33" fill="none" stroke="url(#nm-mark-orbit)" stroke-width="2" stroke-opacity="0.95" stroke-linecap="round"/>
    <!-- 轨道彗星 -->
    <g transform="translate(57.2 32.2)">
      <circle r="4.6" fill="#9be7ff" opacity="0.3"/>
      <circle r="2.2" fill="#ffffff"/>
    </g>
  </g>
  <!-- 四芒星核（与 novamind-icon 同构：星体+内核+十字光） -->
  <g transform="translate(32 33)">
    <path d="M0 -21 C1.4 -6 6 -1.4 21 0 C6 1.4 1.4 6 0 21 C-1.4 6 -6 1.4 -21 0 C-6 -1.4 -1.4 -6 0 -21 Z" fill="#67e8f9" opacity="0.28" filter="url(#nm-mark-b1)" transform="translate(-1.4 -0.6)"/>
    <path d="M0 -21 C1.4 -6 6 -1.4 21 0 C6 1.4 1.4 6 0 21 C-1.4 6 -6 1.4 -21 0 C-6 -1.4 -1.4 -6 0 -21 Z" fill="#e879f9" opacity="0.2" filter="url(#nm-mark-b1)" transform="translate(1.4 1)"/>
    <path d="M0 -21 C1.4 -6 6 -1.4 21 0 C6 1.4 1.4 6 0 21 C-1.4 6 -6 1.4 -21 0 C-6 -1.4 -1.4 -6 0 -21 Z" fill="url(#nm-mark-body)" filter="url(#nm-mark-b1)"/>
    <path d="M0 -21 C1.4 -6 6 -1.4 21 0 C6 1.4 1.4 6 0 21 C-1.4 6 -6 1.4 -21 0 C-6 -1.4 -1.4 -6 0 -21 Z" fill="#ffffff" transform="scale(0.48)"/>
    <g stroke="#ffffff" stroke-linecap="round" opacity="0.5">
      <line x1="-26" y1="0" x2="26" y2="0" stroke-width="1" opacity="0.35"/>
      <line x1="0" y1="-13" x2="0" y2="13" stroke-width="1" opacity="0.22"/>
    </g>
  </g>
  <!-- 辅星 -->
  <path fill="#ffffff" opacity="0.9" d="M50.5 9.5 C50.8 11.6 51.5 12.3 53.6 12.6 C51.5 12.9 50.8 13.6 50.5 15.7 C50.2 13.6 49.5 12.9 47.4 12.6 C49.5 12.3 50.2 11.6 50.5 9.5 Z"/>
  <circle cx="12.5" cy="13" r="1.1" fill="#ffffff" opacity="0.55"/>
</svg>
