# =====================================================================
# NovaMind 门户 nginx 站点配置（server 块模板）
# ---------------------------------------------------------------------
# 本文件在镜像构建时被复制为 /etc/nginx/templates/default.conf.template，
# 容器启动时由官方镜像内置脚本 docker-entrypoint.d/20-envsubst-on-templates.sh
# 渲染为 /etc/nginx/conf.d/default.conf（覆盖镜像自带的默认站点）：
#   * 仅 ${GATEWAY_URL} 会被 envsubst 替换为环境变量（默认值见 Dockerfile ENV）；
#   * nginx 运行时变量（$uri、$remote_addr 等）不是环境变量，不会被替换。
# 主配置沿用官方镜像自带 /etc/nginx/nginx.conf（include conf.d/*.conf）。
# =====================================================================

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 新版门户为 SPA + RAG 文档上传（走 /api），放开请求体限制
    #（nginx 默认 1m，会 413）
    client_max_body_size 50m;

    # 变量形式的 proxy_pass 需要运行时 DNS 解析；127.0.0.11 为 Docker 内嵌 DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- 静态资源 gzip（text/html 默认压缩，此处声明其余类型）----
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_vary         on;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/x-javascript
                      application/json application/manifest+json
                      application/xml image/svg+xml application/wasm;

    # ---- 健康检查端点（镜像 HEALTHCHECK 与 compose healthcheck 使用）----
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- Vite 构建产物（文件名含内容哈希，可永久缓存）----
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # PWA 关键文件必须每次回源校验，禁止长缓存
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files  $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header   Cache-Control "no-cache";
        try_files    $uri =404;
    }

    # ---- 反代网关：逐条复刻 vite.config.ts 的 dev 代理规则 ----

    # /ais → 网关，原样透传（dev 代理无 rewrite；changeOrigin 由默认
    # Host=$proxy_host 复刻）。AI 对话为 SSE 流式：关闭缓冲并延长读超时。
    location /ais {
        proxy_pass ${GATEWAY_URL};
        proxy_http_version 1.1;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # /api → 网关，去掉 /api 前缀后转发，复刻 dev 代理的
    # rewrite: path.replace(/^\/api/, '')（/api/foo → /foo，/api → /）。
    # 因 proxy_pass 使用变量（支持 GATEWAY_URL 运行时注入），不能在
    # proxy_pass 中携带 URI，需用 rewrite 改写请求路径。
    location /api {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass ${GATEWAY_URL};
        proxy_http_version 1.1;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- SPA history 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
