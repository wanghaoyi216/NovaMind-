worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    resolver 127.0.0.11 valid=10s ipv6=off;
    sendfile        on;
    keepalive_timeout  65;


    # API网关
    server {
        listen       80;
        server_name  api.novamind.com;
        # Backend services run on the Windows host in local development.
        set $gateway http://host.docker.internal:10010;
        location / {
            proxy_pass $gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Nacos
    server {
        listen       80;
        server_name  nacos.novamind.com;
        set $nacos http://novamind-nacos:8848;
        location = / {
            return 302 /nacos/;
        }
        location /nacos/ {
            proxy_pass $nacos;
        }
        location / {
            return 302 /nacos/;
        }
    }

    # XXL-Job
    server {
        listen       80;
        server_name  xxljob.novamind.com;
        set $xxljob http://novamind-xxljob:8880;
        location = / {
            return 302 /xxl-job-admin/;
        }
        location /xxl-job-admin {
            proxy_pass $xxljob;
        }
        location / {
            return 302 /xxl-job-admin/;
        }
    }

    # RabbitMQ管理
    server {
        listen       80;
        server_name  mq.novamind.com;
        set $rabbitmq http://novamind-rabbitmq:15672;
        location / {
            proxy_pass $rabbitmq;
        }
    }

    # ES
    server {
        listen       80;
        server_name  es.novamind.com;
        set $es http://novamind-es:9200;
        location / {
            proxy_pass $es;
        }
    }

    # Neo4j Browser
    server {
        listen       80;
        server_name  neo4j.novamind.com;
        set $neo4j http://novamind-neo4j:7474;
        location / {
            proxy_pass $neo4j;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
