spring:
  cloud:
    nacos:
      server-addr: localhost:8848 # nacos注册中心
      username: nacos
      password: nacos
      discovery:
        group: DEFAULT_GROUP
      config:
        file-extension: yaml
  config:
    import:
      - nacos:${spring.application.name}.yaml # 导入本服务的配置
      - nacos:shared-spring.yaml # 共享spring配置
      - nacos:shared-redis.yaml # 共享redis配置
      - nacos:shared-logs.yaml
      - nacos:shared-mybatis.yaml # 共享日志配置
logging:
  level:
    com.novamind: debug
